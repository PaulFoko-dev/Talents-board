<nav class="navbar navbar-expand-lg navbar-dark bg-primary" *ngIf="currentUser">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/tickets">
      <i class="bi bi-briefcase-fill me-2"></i>Talents-Board
    </a>
    <button class="navbar-toggler" type="button" (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/tickets" routerLinkActive="active">
            <i class="bi bi-ticket-fill me-1"></i>Tickets
          </a>
        </li>
        <li class="nav-item" *ngIf="currentUser?.role === 'ENTERPRISE'">
          <a class="nav-link" routerLink="/candidates" routerLinkActive="active">
            <i class="bi bi-people-fill me-1"></i>Candidats
          </a>
        </li>
        <li class="nav-item" *ngIf="currentUser?.role === 'CANDIDATE'">
          <a class="nav-link" routerLink="/enterprises" routerLinkActive="active">
            <i class="bi bi-building me-1"></i>Entreprises
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/notifications" routerLinkActive="active">
            <i class="bi bi-bell-fill me-1"></i>Notifications
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/profile" routerLinkActive="active">
            <i class="bi bi-person-circle me-1"></i>{{ currentUser?.displayName }}
          </a>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm ms-2" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main [class.container-fluid]="currentUser" [class.mt-4]="currentUser">
  <router-outlet></router-outlet>
</main>
