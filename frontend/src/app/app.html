<nav class="tb-nav" *ngIf="currentUser">
  <div class="tb-nav-inner">
    <a class="tb-brand" routerLink="/tickets">
      <span class="tb-brand-dot"></span>
      Talents-Board
    </a>
    <div class="tb-nav-links">
      <a class="tb-nav-link" routerLink="/tickets" routerLinkActive="active">
        <i class="bi bi-ticket-perforated"></i> Tickets
      </a>
      <a class="tb-nav-link" routerLink="/candidates" routerLinkActive="active" *ngIf="currentUser?.role === 'ENTERPRISE'">
        <i class="bi bi-people"></i> Candidats
      </a>
      <a class="tb-nav-link" routerLink="/enterprises" routerLinkActive="active" *ngIf="currentUser?.role === 'CANDIDATE'">
        <i class="bi bi-buildings"></i> Entreprises
      </a>
      <a class="tb-nav-link" routerLink="/notifications" routerLinkActive="active">
        <i class="bi bi-bell"></i> Notifications
      </a>
    </div>
    <div class="tb-nav-right">
      <a class="tb-avatar" routerLink="/profile" title="Mon profil">
        {{ currentUser?.displayName?.charAt(0)?.toUpperCase() }}
      </a>
      <button class="tb-logout-btn" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </div>
</nav>

<main [style.padding-top]="currentUser ? 'var(--nav-h)' : '0'">
  <router-outlet></router-outlet>
</main>
